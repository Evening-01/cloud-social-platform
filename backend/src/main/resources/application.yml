server:
  port: 9090
  shutdown: graceful

spring:
  application:
    name: cloud-social-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:social_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:social}
    password: ${DB_PASSWORD:Social@2026}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# 文件上传配置
upload:
  image-max-size: 10485760        # 图片 ≤10MB
  video-max-size: 524288000       # 视频 ≤500MB
  chunk-size: 5242880             # 分片 5MB
  local-storage: ${UPLOAD_DIR:./uploads}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:cloud-social-platform-jwt-secret-key-2026-please-change-in-prod}
  expiration-ms: 86400000         # 24 小时

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.cloudsocial: DEBUG
    org.hibernate.SQL: WARN
